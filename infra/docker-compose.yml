name: easy-fashion

services:
  postgres:
    image: postgres:16-alpine
    container_name: easy_fashion_postgres
    env_file:
      - ../app-backend/.env
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
