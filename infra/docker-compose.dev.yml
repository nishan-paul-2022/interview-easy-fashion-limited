version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: easy-fashion-postgres-dev
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-easy-fashion}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-easy-fashion}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../app-backend
      dockerfile: Dockerfile
      target: builder
    container_name: easy-fashion-backend-dev
    command: npm run start:dev
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-easy-fashion}?schema=public
    env_file:
      - ../app-backend/.env
    ports:
      - "${BACKEND_PORT:-3015}:3000"
    volumes:
      - ../app-backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  customer:
    build:
      context: ../app-customer
      dockerfile: Dockerfile
      target: builder
    container_name: easy-fashion-customer-dev
    command: npm run dev
    env_file:
      - ../app-customer/.env
    ports:
      - "${CUSTOMER_PORT:-3013}:3000"
    volumes:
      - ../app-customer:/app
      - /app/node_modules
      - /app/.next

  management:
    build:
      context: ../app-management
      dockerfile: Dockerfile
      target: builder
    container_name: easy-fashion-management-dev
    command: npm run dev
    env_file:
      - ../app-management/.env
    ports:
      - "${MANAGEMENT_PORT:-3014}:3000"
    volumes:
      - ../app-management:/app
      - /app/node_modules
      - /app/.next

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: easy-fashion-pgadmin-dev
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@easyfashion.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - debug

volumes:
  postgres_data:
