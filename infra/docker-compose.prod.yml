version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: easy-fashion-postgres-prod
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-easy-fashion}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-easy-fashion}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../app-backend
      dockerfile: Dockerfile
    container_name: easy-fashion-backend-prod
    env_file:
      - ../app-backend/.env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  customer:
    build:
      context: ../app-customer
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: easy-fashion-customer-prod
    env_file:
      - ../app-customer/.env
    restart: unless-stopped

  management:
    build:
      context: ../app-management
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: easy-fashion-management-prod
    env_file:
      - ../app-management/.env
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: easy-fashion-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../infra/nginx:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt
    restart: unless-stopped
    depends_on:
      - backend
      - customer
      - management

volumes:
  postgres_data:
