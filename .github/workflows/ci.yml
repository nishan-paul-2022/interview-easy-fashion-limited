name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install All Dependencies
        run: make install
      - name: Run ESLint
        run: make lint
      - name: Run Prettier Check
        run: npx prettier --check .

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: easy-fashion-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: app-backend/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('app-backend/package-lock.json') }}
      - name: Install Backend Dependencies
        run: npm install
        working-directory: ./app-backend
      - name: Generate Prisma Client
        working-directory: ./app-backend
        run: npx prisma generate
      - name: Run Prisma Migrations
        working-directory: ./app-backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/easy-fashion-test
        run: npx prisma migrate deploy
      - name: Run Backend Tests
        working-directory: ./app-backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/easy-fashion-test
          JWT_SECRET: test-secret
          JWT_ACCESS_SECRET: test-secret
          JWT_REFRESH_SECRET: test-secret
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          GOOGLE_CLIENT_ID: test
          GOOGLE_CLIENT_SECRET: test
          GOOGLE_REDIRECT_URI: test
          FACEBOOK_CLIENT_ID: test
          FACEBOOK_CLIENT_SECRET: test
          FACEBOOK_CALLBACK_URL: test
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
          CORS_ORIGIN_CUSTOMER: http://localhost:3013
          CORS_ORIGIN_MANAGEMENT: http://localhost:3014
          SUPER_ADMIN_EMAIL: test@test.com
          SUPER_ADMIN_PASSWORD: test
          THROTTLE_TTL: 60
          THROTTLE_LIMIT: 100
        run: npm run test && npm run test:e2e

  test-customer:
    name: Test Customer App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache customer node_modules
        uses: actions/cache@v4
        with:
          path: app-customer/node_modules
          key: ${{ runner.os }}-customer-${{ hashFiles('app-customer/package-lock.json') }}
      - name: Install Customer Dependencies
        run: npm install
        working-directory: ./app-customer
      - name: Run Customer Tests
        working-directory: ./app-customer
        run: npm run test

  test-management:
    name: Test Management App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache management node_modules
        uses: actions/cache@v4
        with:
          path: app-management/node_modules
          key: ${{ runner.os }}-management-${{ hashFiles('app-management/package-lock.json') }}
      - name: Install Management Dependencies
        run: npm install
        working-directory: ./app-management
      - name: Run Management Tests
        working-directory: ./app-management
        run: npm run test

  e2e-customer:
    name: E2E Customer
    runs-on: ubuntu-latest
    needs: [test-backend, test-customer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache customer node_modules
        uses: actions/cache@v4
        with:
          path: app-customer/node_modules
          key: ${{ runner.os }}-customer-${{ hashFiles('app-customer/package-lock.json') }}
      - name: Install Customer Dependencies
        run: npm install
        working-directory: ./app-customer
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: ./app-customer
      - name: Run Playwright Tests
        working-directory: ./app-customer
        run: npm run test:e2e
      - name: Upload Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-customer
          path: app-customer/playwright-report/
          retention-days: 7

  e2e-management:
    name: E2E Management
    runs-on: ubuntu-latest
    needs: [test-backend, test-management]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache management node_modules
        uses: actions/cache@v4
        with:
          path: app-management/node_modules
          key: ${{ runner.os }}-management-${{ hashFiles('app-management/package-lock.json') }}
      - name: Install Management Dependencies
        run: npm install
        working-directory: ./app-management
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: ./app-management
      - name: Run Playwright Tests
        working-directory: ./app-management
        run: npm run test:e2e
      - name: Upload Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-management
          path: app-management/playwright-report/
          retention-days: 7
