name: CD Pipeline

on:
  workflow_run:
    workflows: ['CI Pipeline']
    types:
      - completed
    branches:
      - main

jobs:
  build-backend:
    name: Build and Push Backend
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.ENABLE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./app-backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/easy-fashion-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-customer:
    name: Build and Push Customer App
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.ENABLE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Customer App
        uses: docker/build-push-action@v5
        with:
          context: ./app-customer
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/easy-fashion-customer:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-easy.kaiofficial.xyz/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-management:
    name: Build and Push Management App
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.ENABLE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Management App
        uses: docker/build-push-action@v5
        with:
          context: ./app-management
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/easy-fashion-management:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://api-easy.kaiofficial.xyz/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    needs: [build-backend, build-customer, build-management]
    # Only run if CI was successful AND deployment is enabled for this environment
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.ENABLE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Infrastructure Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'infra/docker-compose.yml,infra/nginx'
          target: '/var/www/easy-fashion'

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images and restart containers
            cd /var/www/easy-fashion
            docker compose -f infra/docker-compose.yml pull
            docker compose -f infra/docker-compose.yml up -d --remove-orphans

            # Run DB migrations
            sleep 5
            docker compose -f infra/docker-compose.yml exec -T backend npx prisma migrate deploy
            docker compose -f infra/docker-compose.yml exec -T backend node prisma/seed.js

            # Copy Nginx configs and reload
            cp -r infra/nginx/* /etc/nginx/sites-available/
            for f in /etc/nginx/sites-available/easy-fashion /etc/nginx/sites-available/admin-easy-fashion /etc/nginx/sites-available/api-easy-fashion; do
              ln -sf $f /etc/nginx/sites-enabled/$(basename $f)
            done
            nginx -t && systemctl reload nginx

      - name: Health Check
        run: |
          echo "Waiting 10 seconds for services to fully initialize..."
          sleep 10
          curl --fail https://api-easy.kaiofficial.xyz/api/v1/health
